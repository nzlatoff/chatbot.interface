<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <!-- https://favicon.io/favicon-converter/ -->
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
    <link rel="manifest" href="/favicon/site.webmanifest">
    <!-- favicon end -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="/css/login.css" type="text/css" rel="stylesheet"/>
  </head>
  <body class="login page">
    <form method="post" class="form" action="/signin">
      <h4 class="title">Username</h4>
      <div class="box-submit">
        <input class="username-input" name="username" type="text" minlength="1" required>
      </div>
      <h4 class="title">Password</h4>
      <div class="box-submit">
        <input class="username-input" name="password" type="password" minlength="1" required>
      </div>
      <div class="box-submit">
      <button type="submit" class="enter">Sign in</button>
      </div>

    </form>
    <script>
      document.getElementsByClassName('username-input')[0].focus();
    </script>
  </body>
</html>
